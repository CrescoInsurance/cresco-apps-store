<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cresco Apps Store</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f5f6f8;
    --card-bg:#ffffff;
    --text:#1d2229;
    --muted:#667085;
    --border:#e6e8ec;
    --accent:#3b5bfd;
    --accent-soft:#eef1ff;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a;
      --card-bg:#1d2026;
      --text:#eef0f3;
      --muted:#9aa1ac;
      --border:#2b2f37;
      --accent:#7c92ff;
      --accent-soft:#232849;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  /* ---------- Lock screen ---------- */
  #lock-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  #lock-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:36px 32px;
    width:100%;
    max-width:360px;
    text-align:center;
  }
  #lock-card .emoji{font-size:36px;margin-bottom:8px;}
  #lock-card h1{font-size:19px;margin:0 0 4px;}
  #lock-card p{color:var(--muted);font-size:13.5px;margin:0 0 20px;}
  #lock-card input{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    margin-bottom:12px;
  }
  #lock-card button{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  #lock-card button:hover{opacity:.92;}
  #lock-error{color:#e5484d;font-size:13px;margin-top:10px;min-height:16px;}

  /* ---------- Store ---------- */
  #store{display:none;}
  header{
    padding:28px 24px 20px;
    max-width:1080px;
    margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:40px;height:40px;border-radius:10px;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0;
  }
  .brand h1{font-size:20px;margin:0;}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:13.5px;}

  main{max-width:1080px;margin:0 auto;padding:0 24px 60px;}
  .section-label{
    text-transform:uppercase;
    font-size:11.5px;
    letter-spacing:.06em;
    color:var(--muted);
    font-weight:700;
    margin:28px 0 12px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:16px;
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
  }
  .card .icon{
    width:38px;height:38px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;margin-bottom:14px;
  }
  .card h3{font-size:15.5px;margin:0 0 6px;}
  .card p{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.45;flex-grow:1;}
  .card a.open-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    background:var(--accent);
    color:#fff;
    font-size:13.5px;
    font-weight:600;
    padding:9px 14px;
    border-radius:8px;
  }
  .card a.open-btn:hover{opacity:.92;}
  .card.pending a.open-btn{
    background:var(--border);
    color:var(--muted);
    pointer-events:none;
  }
  .badge{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    padding:2px 8px;
    border-radius:99px;
    background:var(--accent-soft);
    color:var(--accent);
    margin-bottom:10px;
    width:fit-content;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:8px 24px 16px;
  }
  #manage-toggle{
    display:block;
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:4px 24px 30px;
    cursor:pointer;
    text-decoration:underline;
    background:none;
    border:none;
    width:100%;
  }

  /* ---------- Admin panel ---------- */
  #admin-panel{
    display:none;
    max-width:1080px;
    margin:0 auto 60px;
    padding:0 24px;
  }
  .admin-box{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:20px;
  }
  .admin-box h2{font-size:14px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .admin-row{
    display:grid;
    grid-template-columns:1fr 1fr 1.4fr 70px 90px 1fr auto auto;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
  }
  .admin-row input{
    padding:7px 9px;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:12.5px;
    width:100%;
  }
  .admin-row button{
    padding:7px 10px;
    border-radius:7px;
    border:none;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-save{background:var(--accent);color:#fff;}
  .btn-delete{background:#fde8e8;color:#c0342c;}
  .admin-labels{
    display:grid;
    grid-template-columns:1fr 1fr 1.4fr 70px 90px 1fr auto auto;
    gap:8px;
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  #pw-admin-row{display:flex;gap:10px;}
  #pw-admin-row input{
    flex:1;
    padding:9px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:14px;
  }
  #pw-admin-row button{
    padding:9px 16px;
    border-radius:8px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-weight:600;
    cursor:pointer;
  }
  .admin-status{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px;}
  @media (max-width:900px){
    .admin-row, .admin-labels{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

  <!-- ============ LOCK SCREEN ============ -->
  <div id="lock-screen">
    <div id="lock-card">
      <div class="emoji">🗂️</div>
      <h1>Cresco Apps Store</h1>
      <p id="lock-sub">Enter the access password to continue</p>
      <input type="password" id="pw-input" placeholder="Password" autofocus>
      <button onclick="tryUnlock()">Unlock</button>
      <div id="lock-error"></div>
    </div>
  </div>

  <!-- ============ APP STORE ============ -->
  <div id="store">
    <header>
      <div class="brand">
        <div class="mark">C</div>
        <div>
          <h1>Cresco Apps Store</h1>
          <p>All your client &amp; team apps, in one place</p>
        </div>
      </div>
    </header>
    <main id="main"></main>
    <button id="manage-toggle" onclick="toggleAdmin()">⚙ Manage apps &amp; password</button>

    <!-- ============ ADMIN PANEL ============ -->
    <div id="admin-panel">
      <div class="admin-box">
        <h2>Access password</h2>
        <div id="pw-admin-row">
          <input type="text" id="admin-password-input" placeholder="New password">
          <button onclick="savePassword()">Save password</button>
        </div>
        <div class="admin-status" id="pw-status"></div>
      </div>

      <div class="admin-box">
        <h2>Apps</h2>
        <div class="admin-labels">
          <div>Name</div><div>Category</div><div>Description</div><div>Icon</div><div>Color</div><div>URL</div><div></div><div></div>
        </div>
        <div id="admin-apps-list"></div>
        <div class="admin-status" id="apps-status"></div>
      </div>

      <div class="admin-box">
        <h2>Add a new app</h2>
        <div class="admin-row" style="grid-template-columns:1fr 1fr 1.4fr 70px 90px 1fr auto;">
          <input id="new-name" placeholder="Name">
          <input id="new-category" placeholder="Category" value="Apps">
          <input id="new-description" placeholder="Description">
          <input id="new-icon" placeholder="🙂" value="📦">
          <input id="new-color" placeholder="#eef1ff" value="#eef1ff">
          <input id="new-url" placeholder="https://... (blank = coming soon)">
          <button class="btn-save" onclick="addApp()">Add</button>
        </div>
        <div class="admin-status" id="add-status"></div>
      </div>
    </div>

    <footer>Cresco Apps Store — built with Claude · last updated <span id="updated-date"></span></footer>
  </div>

<script>
/* =====================================================================
   SUPABASE CONFIG
   Reusing the same Supabase project as Outpost Booking.
   Paste the anon/public key from: Supabase dashboard → this project →
   Settings → API → "anon public" key.
   ===================================================================== */
const SUPABASE_URL = "https://motngoikyliitjhzudvz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vdG5nb2lreWxpaXRqaHp1ZHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MzIwMDEsImV4cCI6MjA5ODUwODAwMX0.O8MtBN6BoF0VqNZlyzJandO-ApBjKo0q2k7PlxVzeyM";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let CURRENT_PASSWORD = null;
let APPS = [];

async function loadSettings(){
  const { data, error } = await sb.from('store_settings').select('value').eq('key','site_password').single();
  if(error){ console.error(error); return null; }
  return data ? data.value : null;
}

async function loadApps(){
  const { data, error } = await sb.from('store_apps').select('*').order('category').order('created_at');
  if(error){ console.error(error); return []; }
  return data || [];
}

async function init(){
  CURRENT_PASSWORD = await loadSettings();
  if(CURRENT_PASSWORD === null){
    document.getElementById('lock-sub').textContent = "Couldn't load settings — check your connection and reload.";
    return;
  }
  try{
    if(sessionStorage.getItem('cresco_unlocked') === '1'){
      await showStore();
    }
  }catch(e){}
}

function tryUnlock(){
  const input = document.getElementById('pw-input');
  const error = document.getElementById('lock-error');
  if(CURRENT_PASSWORD !== null && input.value === CURRENT_PASSWORD){
    try{ sessionStorage.setItem('cresco_unlocked','1'); }catch(e){}
    showStore();
  }else{
    error.textContent = "Incorrect password, try again.";
    input.value = "";
    input.focus();
  }
}

document.getElementById('pw-input').addEventListener('keydown', function(e){
  if(e.key === 'Enter') tryUnlock();
});

async function showStore(){
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('store').style.display = 'block';
  APPS = await loadApps();
  renderApps();
}

function renderApps(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const categories = [...new Set(APPS.map(a => a.category || 'Apps'))];

  categories.forEach(cat => {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = cat;
    main.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'grid';

    APPS.filter(a => (a.category || 'Apps') === cat).forEach(app => {
      const pending = !app.url;
      const card = document.createElement('div');
      card.className = 'card' + (pending ? ' pending' : '');
      card.innerHTML = `
        ${pending ? '<span class="badge">Coming soon</span>' : ''}
        <div class="icon" style="background:${app.color || '#eef1ff'}">${app.icon || '📦'}</div>
        <h3>${app.name}</h3>
        <p>${app.description || ''}</p>
        <a class="open-btn" href="${app.url || '#'}" target="_blank" rel="noopener">
          ${pending ? 'Not linked yet' : 'Open App →'}
        </a>
      `;
      grid.appendChild(card);
    });

    main.appendChild(grid);
  });

  document.getElementById('updated-date').textContent =
    new Date().toLocaleDateString('en-SG', { year:'numeric', month:'long', day:'numeric' });
}

/* ---------- Admin panel ---------- */

function toggleAdmin(){
  const panel = document.getElementById('admin-panel');
  const showing = panel.style.display === 'block';
  panel.style.display = showing ? 'none' : 'block';
  if(!showing) renderAdmin();
}

function renderAdmin(){
  document.getElementById('admin-password-input').value = '';
  document.getElementById('admin-password-input').placeholder = CURRENT_PASSWORD || 'New password';

  const list = document.getElementById('admin-apps-list');
  list.innerHTML = '';
  APPS.forEach(app => {
    const row = document.createElement('div');
    row.className = 'admin-row';
    row.innerHTML = `
      <input id="f-name-${app.id}" value="${escapeAttr(app.name)}">
      <input id="f-category-${app.id}" value="${escapeAttr(app.category || '')}">
      <input id="f-description-${app.id}" value="${escapeAttr(app.description || '')}">
      <input id="f-icon-${app.id}" value="${escapeAttr(app.icon || '')}">
      <input id="f-color-${app.id}" value="${escapeAttr(app.color || '')}">
      <input id="f-url-${app.id}" value="${escapeAttr(app.url || '')}">
      <button class="btn-save" onclick="saveApp('${app.id}')">Save</button>
      <button class="btn-delete" onclick="deleteApp('${app.id}')">Delete</button>
    `;
    list.appendChild(row);
  });
}

function escapeAttr(str){
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

async function savePassword(){
  const val = document.getElementById('admin-password-input').value.trim();
  const status = document.getElementById('pw-status');
  if(!val){ status.textContent = 'Enter a new password first.'; return; }
  status.textContent = 'Saving...';
  const { error } = await sb.from('store_settings').upsert({ key:'site_password', value: val });
  if(error){ status.textContent = 'Error saving password: ' + error.message; return; }
  CURRENT_PASSWORD = val;
  status.textContent = 'Password updated ✓';
}

async function saveApp(id){
  const status = document.getElementById('apps-status');
  status.textContent = 'Saving...';
  const payload = {
    name: document.getElementById(`f-name-${id}`).value.trim(),
    category: document.getElementById(`f-category-${id}`).value.trim() || 'Apps',
    description: document.getElementById(`f-description-${id}`).value.trim(),
    icon: document.getElementById(`f-icon-${id}`).value.trim() || '📦',
    color: document.getElementById(`f-color-${id}`).value.trim() || '#eef1ff',
    url: document.getElementById(`f-url-${id}`).value.trim(),
  };
  const { error } = await sb.from('store_apps').update(payload).eq('id', id);
  if(error){ status.textContent = 'Error saving: ' + error.message; return; }
  status.textContent = 'Saved ✓';
  APPS = await loadApps();
  renderApps();
  renderAdmin();
}

async function deleteApp(id){
  if(!confirm('Delete this app card? This cannot be undone.')) return;
  const status = document.getElementById('apps-status');
  status.textContent = 'Deleting...';
  const { error } = await sb.from('store_apps').delete().eq('id', id);
  if(error){ status.textContent = 'Error deleting: ' + error.message; return; }
  APPS = await loadApps();
  renderApps();
  renderAdmin();
  status.textContent = 'Deleted ✓';
}

async function addApp(){
  const status = document.getElementById('add-status');
  const name = document.getElementById('new-name').value.trim();
  if(!name){ status.textContent = 'Give the app a name first.'; return; }
  const payload = {
    name,
    category: document.getElementById('new-category').value.trim() || 'Apps',
    description: document.getElementById('new-description').value.trim(),
    icon: document.getElementById('new-icon').value.trim() || '📦',
    color: document.getElementById('new-color').value.trim() || '#eef1ff',
    url: document.getElementById('new-url').value.trim(),
  };
  status.textContent = 'Adding...';
  const { error } = await sb.from('store_apps').insert(payload);
  if(error){ status.textContent = 'Error adding: ' + error.message; return; }
  ['new-name','new-description','new-url'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('new-category').value = 'Apps';
  document.getElementById('new-icon').value = '📦';
  document.getElementById('new-color').value = '#eef1ff';
  APPS = await loadApps();
  renderApps();
  renderAdmin();
  status.textContent = 'Added ✓';
}

init();
</script>
</body>
</html>
