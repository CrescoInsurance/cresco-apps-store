<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cresco Apps Store</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f5f6f8;
    --card-bg:#ffffff;
    --text:#1d2229;
    --muted:#667085;
    --border:#e6e8ec;
    --accent:#3b5bfd;
    --accent-soft:#eef1ff;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a;
      --card-bg:#1d2026;
      --text:#eef0f3;
      --muted:#9aa1ac;
      --border:#2b2f37;
      --accent:#7c92ff;
      --accent-soft:#232849;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  /* ---------- Lock screen ---------- */
  #lock-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  #lock-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:36px 32px;
    width:100%;
    max-width:360px;
    text-align:center;
  }
  #lock-card .emoji{font-size:36px;margin-bottom:8px;}
  #lock-card h1{font-size:19px;margin:0 0 4px;}
  #lock-card p{color:var(--muted);font-size:13.5px;margin:0 0 20px;}
  #lock-card input{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    margin-bottom:12px;
  }
  #lock-card button{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  #lock-card button:hover{opacity:.92;}
  #lock-error{color:#e5484d;font-size:13px;margin-top:10px;min-height:16px;}

  /* ---------- Store ---------- */
  #store{display:none;}
  header{
    padding:28px 24px 20px;
    max-width:1080px;
    margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:40px;height:40px;border-radius:10px;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0;
  }
  .brand h1{font-size:20px;margin:0;}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:13.5px;}

  main{max-width:1080px;margin:0 auto;padding:0 24px 60px;}
  .section-label{
    text-transform:uppercase;
    font-size:11.5px;
    letter-spacing:.06em;
    color:var(--muted);
    font-weight:700;
    margin:28px 0 12px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:16px;
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
  }
  .card .icon{
    width:38px;height:38px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;margin-bottom:14px;
  }
  .card h3{font-size:15.5px;margin:0 0 6px;}
  .card p{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.45;flex-grow:1;}
  .card a.open-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    background:var(--accent);
    color:#fff;
    font-size:13.5px;
    font-weight:600;
    padding:9px 14px;
    border-radius:8px;
  }
  .card a.open-btn:hover{opacity:.92;}
  .card.pending a.open-btn{
    background:var(--border);
    color:var(--muted);
    pointer-events:none;
  }
  .badge{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    padding:2px 8px;
    border-radius:99px;
    background:var(--accent-soft);
    color:var(--accent);
    margin-bottom:10px;
    width:fit-content;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:8px 24px 16px;
  }
  #manage-toggle{
    display:block;
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:4px 24px 30px;
    cursor:pointer;
    text-decoration:underline;
    background:none;
    border:none;
    width:100%;
  }

  /* ---------- Admin panel ---------- */
  #admin-panel{
    display:none;
    max-width:1080px;
    margin:0 auto 60px;
    padding:0 24px;
  }
  .admin-box{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:20px;
  }
  .admin-box h2{font-size:14px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .admin-row{
    display:grid;
    grid-template-columns:1fr 1fr 1.4fr 70px 90px 1fr auto auto;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
  }
  .admin-row input{
    padding:7px 9px;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:12.5px;
    width:100%;
  }
  .admin-row button{
    padding:7px 10px;
    border-radius:7px;
    border:none;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-save{background:var(--accent);color:#fff;}
  .btn-delete{background:#fde8e8;color:#c0342c;}
  .admin-labels{
    display:grid;
    grid-template-columns:1fr 1fr 1.4fr 70px 90px 1fr auto auto;
    gap:8px;
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  #pw-admin-row{display:flex;gap:10px;}
  #pw-admin-row input{
    flex:1;
    padding:9px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:14px;
  }
  #pw-admin-row button{
    padding:9px 16px;
    border-radius:8px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-weight:600;
    cursor:pointer;
  }
  .admin-status{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px;}
